[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
  { access = "read",       path = "../testvectors" },
  { access = "read",       path = "./test/fixtures" },
  { access = "read-write", path = "./gas" },
]
remappings = ["forge-std/=lib/forge-std/src/"]
